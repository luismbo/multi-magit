name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Emacs ${{ matrix.emacs-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs-version: ['28.2', '29.4', '30.1', snapshot]
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}
      - name: Install dependencies
        run: |
          emacs -Q --batch \
            --eval "(require 'package)" \
            --eval "(add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\") t)" \
            --eval "(package-initialize)" \
            --eval "(package-refresh-contents)" \
            --eval "(dolist (p '(magit dash package-lint)) (package-install p))"
      - name: Byte-compile
        run: |
          emacs -Q --batch -L . \
            --eval "(package-initialize)" \
            --eval "(setq byte-compile-error-on-warn t)" \
            -f batch-byte-compile multi-magit.el
      - name: package-lint
        run: |
          emacs -Q --batch \
            --eval "(package-initialize)" \
            --eval "(require 'package-lint)" \
            --eval "(add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\") t)" \
            -f package-lint-batch-and-exit multi-magit.el

  melpazoid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install melpazoid
        run: |
          python -m pip install --upgrade pip
          sudo apt-get install -y emacs && emacs --version
          git clone https://github.com/riscy/melpazoid.git ~/melpazoid
          pip install ~/melpazoid
      - name: Run melpazoid
        env:
          LOCAL_REPO: ${{ github.workspace }}
          RECIPE: (multi-magit :fetcher github :repo "luismbo/multi-magit")
          EXIST_OK: false
        run: echo $GITHUB_REF && make -C ~/melpazoid
